[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/login"
  to = "/.netlify/functions/login"
  status = 200

[[redirects]]
  from = "/api/listings"
  to = "/.netlify/functions/listings"
  status = 200

[[redirects]]
  from = "/api/listing"
  to = "/.netlify/functions/listing"
  status = 200

[[redirects]]
  from = "/api/image/*"
  to = "/.netlify/functions/image?id=:splat"
  status = 200
